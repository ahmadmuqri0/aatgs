[project]
name = "backend"
version = "0.1.0"
description = "Server of Automatic Assignment Task Generation System"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1",
  "fastapi[standard]>=0.159.1",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "pymupdf>=2.0",
  "python-multipart>=0.0.32",
  "sqlmodel>=0.0.48",
]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
]
