[project]
name = "backend"
version = "0.1.0"
description = "Server of Automatic Assignment Task Generation System"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1",
  "fastapi[standard]>=0.159.1",
  "pwdlib[argon2,bcrypt]>=0.3.1",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "pyjwt>=2.15.1",
  "pymupdf>=2.0",
  "python-multipart>=0.0.32",
  "sqlmodel>=0.0.48",
]

[project.scripts]
migrate = "src.cli:migrate"
migration = "src.cli:migration"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.fastapi]
entrypoint = "src.main:app"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
]
